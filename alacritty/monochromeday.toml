# MonochromeDay for Alacritty, part of cosmic-monochromeday-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./alacritty/install.sh puts this in ~/.config/alacritty/themes/,
# then in ~/.config/alacritty/alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/monochromeday.toml"]
# (Alacritty 0.13: a top-level `import = [...]` line instead.)

[colors.primary]
background = "#E6E6E6"
foreground = "#1A1A1A"
bright_foreground = "#424242"
dim_foreground = "#616161"

[colors.cursor]
text = "#E6E6E6"
cursor = "#5C5C5C"

[colors.vi_mode_cursor]
text = "#E6E6E6"
cursor = "#5C5C5C"

[colors.selection]
text = "CellForeground"
background = "#C0C0C0"

[colors.search.matches]
foreground = "#E6E6E6"
background = "#515151"

[colors.search.focused_match]
foreground = "#E6E6E6"
background = "#5C5C5C"

[colors.hints.start]
foreground = "#E6E6E6"
background = "#5C5C5C"

[colors.hints.end]
foreground = "#E6E6E6"
background = "#515151"

[colors.footer_bar]
foreground = "#1A1A1A"
background = "#F1F1F1"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.normal]
black   = "#E6E6E6"
red     = "#424242"
green   = "#515151"
yellow  = "#5C5C5C"
blue    = "#5C5C5C"
magenta = "#1A1A1A"
cyan    = "#5C5C5C"
white   = "#1A1A1A"

[colors.bright]
black   = "#ABABAB"
red     = "#282828"
green   = "#424242"
yellow  = "#515151"
blue    = "#1A1A1A"
magenta = "#424242"
cyan    = "#515151"
white   = "#1D1D1D"

[colors.dim]
black   = "#E6E6E6"
red     = "#616161"
green   = "#616161"
yellow  = "#818181"
blue    = "#818181"
magenta = "#616161"
cyan    = "#818181"
white   = "#616161"
