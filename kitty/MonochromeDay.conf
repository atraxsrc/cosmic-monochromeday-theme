# MonochromeDay for kitty, part of cosmic-monochromeday-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/MonochromeDay.conf

foreground              #1A1A1A
background              #E6E6E6
selection_foreground    none
selection_background    #C0C0C0

cursor                  #5C5C5C
cursor_text_color       #E6E6E6

url_color               #515151
url_style               curly

active_border_color     #5C5C5C
inactive_border_color   #C0C0C0
bell_border_color       #5C5C5C

active_tab_foreground   #E6E6E6
active_tab_background   #5C5C5C
inactive_tab_foreground #5C5C5C
inactive_tab_background #F1F1F1
tab_bar_background      #E6E6E6

mark1_foreground        #E6E6E6
mark1_background        #515151
mark2_foreground        #E6E6E6
mark2_background        #515151
mark3_foreground        #E6E6E6
mark3_background        #5C5C5C

# black
color0  #E6E6E6
color8  #ABABAB
