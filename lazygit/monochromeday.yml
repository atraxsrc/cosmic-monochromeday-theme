# MonochromeDay for lazygit, part of cosmic-monochromeday-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/monochromeday.yml and
# zsh/monochromeday.zsh sets LG_CONFIG_FILE to "config.yml,monochromeday.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/monochromeday.yml"
gui:
  theme:
    activeBorderColor:
      - "#5C5C5C"
      - bold
    inactiveBorderColor:
      - "#C0C0C0"
    searchingActiveBorderColor:
      - "#5C5C5C"
      - bold
    optionsTextColor:
      - "#5C5C5C"
    selectedLineBgColor:
      - "#DBDBDB"
    inactiveViewSelectedLineBgColor:
      - "#F1F1F1"
    cherryPickedCommitFgColor:
      - "#E6E6E6"
    cherryPickedCommitBgColor:
      - "#515151"
    markedBaseCommitFgColor:
      - "#E6E6E6"
    markedBaseCommitBgColor:
      - "#515151"
    unstagedChangesColor:
      - "#424242"
    defaultFgColor:
      - "#1A1A1A"
  authorColors:
    "*": "#515151"
