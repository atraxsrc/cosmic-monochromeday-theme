# MonochromeDay colour scheme for qt5ct / qt6ct, part of cosmic-monochromeday-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> MonochromeDay, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#1a1a1a, #f1f1f1, #f1f1f1, #c0c0c0, #dbdbdb, #dbdbdb, #1a1a1a, #424242, #1a1a1a, #f1f1f1, #e6e6e6, #dbdbdb, #5c5c5c, #e6e6e6, #5c5c5c, #5c5c5c, #f1f1f1, #e6e6e6, #f1f1f1, #1a1a1a, #616161
disabled_colors=#818181, #f1f1f1, #f1f1f1, #c0c0c0, #dbdbdb, #dbdbdb, #818181, #5c5c5c, #818181, #e6e6e6, #e6e6e6, #dbdbdb, #c0c0c0, #5c5c5c, #616161, #616161, #f1f1f1, #e6e6e6, #f1f1f1, #1a1a1a, #c0c0c0
inactive_colors=#1a1a1a, #f1f1f1, #f1f1f1, #c0c0c0, #dbdbdb, #dbdbdb, #1a1a1a, #424242, #1a1a1a, #f1f1f1, #e6e6e6, #dbdbdb, #5c5c5c, #e6e6e6, #5c5c5c, #5c5c5c, #f1f1f1, #e6e6e6, #f1f1f1, #1a1a1a, #616161
